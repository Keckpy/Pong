<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Codespaces Arcade Pong</title>
    <style>
        body { 
            margin: 0; 
            background: #111; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            height: 100vh; 
            color: white; 
            font-family: monospace; 
            overflow: hidden; 
        }
        canvas { 
            background: black; 
            border: 4px solid white; 
            box-shadow: 0 0 20px rgba(255,255,255,0.1); 
        }
    </style>
</head>
<body>

    <canvas id="pong" width="800" height="500"></canvas>

    <script>
        window.addEventListener("DOMContentLoaded", () => {
            const canvas = document.getElementById("pong");
            const ctx = canvas.getContext("2d");

            // Game Constants & Objects
            const paddleW = 15;
            const paddleH = 90;
            
            const ball = { x: canvas.width / 2, y: canvas.height / 2, radius: 10, speed: 7, dx: 7, dy: 0 };
            const p1 = { x: 50, y: canvas.height/2 - paddleH/2, w: paddleW, h: paddleH, score: 0 };
            const p2 = { x: canvas.width - 50 - paddleW, y: canvas.height/2 - paddleH/2, w: paddleW, h: paddleH, score: 0 };

            // Input Tracking
            const keys = {};
            window.addEventListener("keydown", e => keys[e.key.toLowerCase()] = true);
            window.addEventListener("keyup", e => keys[e.key.toLowerCase()] = false);

            function update() {
                // Player 1 Controls (W / S)
                if (keys['w'] && p1.y > 0) p1.y -= 7;
                if (keys['s'] && p1.y < canvas.height - p1.h) p1.y += 7;
                
                // Player 2 Controls (ArrowUp / ArrowDown)
                if (keys['arrowup'] && p2.y > 0) p2.y -= 7;
                if (keys['arrowdown'] && p2.y < canvas.height - p2.h) p2.y += 7;

                // Move Ball
                ball.x += ball.dx;
                ball.y += ball.dy;

                // Wall Bounces (Top & Bottom)
                if (ball.y - ball.radius < 0 || ball.y + ball.radius > canvas.height) {
                    ball.dy *= -1;
                }

                // Identify Active Paddle Side
                let player = (ball.x < canvas.width / 2) ? p1 : p2;

                // Paddle Collision Check
                if (ball.x + ball.radius > player.x && ball.x - ball.radius < player.x + player.w &&
                    ball.y + ball.radius > player.y && ball.y - ball.radius < player.y + player.h) {
                    
                    // 1. Calculate relative hit point from paddle center (-paddleH/2 to +paddleH/2)
                    let collidePoint = ball.y - (player.y + player.h / 2);
                    
                    // 2. Normalize to a range between -1 and 1
                    let normalizedCollidePoint = collidePoint / (player.h / 2);
                    
                    // 3. Set maximum bounce angle to 60 degrees (Math.PI / 3)
                    let bounceAngle = normalizedCollidePoint * (Math.PI / 3);
                    
                    // 4. Flip direction depending on who hit it
                    let direction = (ball.x < canvas.width / 2) ? 1 : -1;
                    
                    // 5. Apply Trigonometric Vector Velocity
                    ball.dx = direction * ball.speed * Math.cos(bounceAngle);
                    ball.dy = ball.speed * Math.sin(bounceAngle);
                    
                    // 6. Accelerate ball speed upon a successful paddle save
                    ball.speed += 0.4;
                }

                // Scoring Conditions
                if (ball.x < 0) { 
                    p2.score++; 
                    resetBall(-1); 
                } else if (ball.x > canvas.width) { 
                    p1.score++; 
                    resetBall(1); 
                }
            }

            function resetBall(directionSign) {
                ball.x = canvas.width / 2; 
                ball.y = canvas.height / 2;
                ball.speed = 7;
                ball.dx = directionSign * ball.speed;
                ball.dy = 0; // Respawns straight out flat
            }

            function draw() {
                // Clear Canvas
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                
                // Draw Center Net Line
                ctx.strokeStyle = "rgba(255,255,255,0.2)";
                ctx.beginPath(); 
                ctx.moveTo(canvas.width/2, 0); 
                ctx.lineTo(canvas.width/2, canvas.height); 
                ctx.stroke();

                // Draw Elements
                ctx.fillStyle = "white";
                ctx.fillRect(p1.x, p1.y, p1.w, p1.h); // Left Paddle
                ctx.fillRect(p2.x, p2.y, p2.w, p2.h); // Right Paddle
                
                ctx.beginPath(); 
                ctx.arc(ball.x, ball.y, ball.radius, 0, Math.PI*2); 
                ctx.fill(); // Ball

                // Draw Scores
                ctx.font = "40px monospace";
                ctx.fillText(p1.score, canvas.width/4, 50);
                ctx.fillText(p2.score, 3 * canvas.width/4, 50);
            }

            function loop() { 
                update(); 
                draw(); 
                requestAnimationFrame(loop); 
            }
            
            loop(); // Kickoff game execution
        });
    </script>
</body>
</html>
